<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Налоговая отчётность · Команда 8</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: home = grid of topic tiles; topic = full-width slide deck with bottom controls; work = sticky monitor bar + question sheet.
   Light only by request: mint paper, green + blue as the two brand colours. */
:root{
  --bg:#f3f8f6; --card:#ffffff; --ink:#10302f; --muted:#56706f; --line:#d3e4df;
  --green:#14875a; --green-2:#0f6b47; --green-soft:#e1f4ea;
  --blue:#1e6bb0; --blue-2:#164f84; --blue-soft:#e2eef9;
  --bad:#c0392b; --bad-soft:#fdecea; --warn:#b26b00; --warn-soft:#fff3dd;
  --display:"Manrope","Segoe UI",system-ui,sans-serif;
  --body:"Golos Text","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--mono)}
.label{font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}

/* top bar */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar .wrap{display:flex;align-items:center;gap:14px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;text-decoration:none;color:var(--ink)}
.logo i{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--green),var(--blue));display:grid;place-items:center;color:#fff;font-style:normal;font-size:.8rem}
.topbar .sp{flex:1}
.homebtn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:.9rem}
.homebtn:hover{border-color:var(--ink)}

/* home */
.hero{padding-block:44px 26px}
.hero h1{font-size:clamp(2rem,5vw,3.4rem);font-weight:800;letter-spacing:-.02em;max-width:18ch}
.hero h1 em{font-style:normal;color:var(--green)}
.hero p{margin-top:14px;color:var(--muted);max-width:62ch;font-size:1.05rem}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-bottom:20px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:10px;min-height:210px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s,border-color .15s}
.tile:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(16,48,47,.45);border-color:var(--green)}
.tile:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.tile .n{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1;color:var(--green)}
.tile:nth-child(even) .n{color:var(--blue)}
.tile h2{font-size:1.2rem;font-weight:700}
.tile p{color:var(--muted);font-size:.93rem}
.tile .arts{margin-top:auto;font-family:var(--mono);font-size:.76rem;color:var(--blue-2)}
.tile.work{background:linear-gradient(135deg,var(--green) 0%,var(--blue) 100%);color:#fff;border:0}
.tile.work .n,.tile.work p,.tile.work .arts{color:#fff}
.tile.work p{opacity:.9}
.tile.small{min-height:auto}
.sub-tiles{display:grid;grid-template-columns:2fr 1fr;gap:16px;padding-bottom:50px}

/* deck */
.deck{padding-block:22px 30px}
.deck-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.deck-head .tn{font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--green)}
.deck-head h2{font-size:1.25rem}
.slide{background:var(--card);border:1px solid var(--line);border-radius:18px;min-height:min(68vh,640px);padding:clamp(20px,4vw,48px);display:flex;flex-direction:column;gap:20px;animation:in .25s ease}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.slide h3{font-size:clamp(1.4rem,3vw,2.1rem);font-weight:800}
.slide .lead{font-size:1.1rem;color:var(--muted);max-width:70ch}
.ctrl{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.ctrl .dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.ctrl .dots button{all:unset;cursor:pointer;width:10px;height:10px;border-radius:50%;background:var(--line)}
.ctrl .dots button[aria-current="true"]{background:var(--green);width:26px;border-radius:6px}
.btn{border:0;border-radius:10px;padding:11px 18px;cursor:pointer;font-weight:600;background:var(--green);color:#fff}
.btn:hover{background:var(--green-2)}
.btn.blue{background:var(--blue)} .btn.blue:hover{background:var(--blue-2)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* building blocks */
.law{border-left:4px solid var(--green);background:var(--green-soft);border-radius:0 12px 12px 0;padding:14px 18px;max-width:80ch}
.law b.ref{display:block;font-family:var(--mono);font-size:.76rem;color:var(--green-2);letter-spacing:.05em;margin-bottom:4px}
.law.blue{border-color:var(--blue);background:var(--blue-soft)} .law.blue b.ref{color:var(--blue-2)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.box{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--card);min-width:0}
.box h4{font-family:var(--display);font-size:1.02rem;margin:0 0 6px}
.box p{font-size:.95rem;color:var(--muted)}
.box.g{background:var(--green-soft);border-color:transparent}
.box.b{background:var(--blue-soft);border-color:transparent}
.pick{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--card);display:flex;flex-direction:column;gap:4px}
.pick:hover{border-color:var(--green)}
.pick[aria-pressed="true"]{border-color:var(--green);box-shadow:inset 0 0 0 2px var(--green);background:var(--green-soft)}
.pick:focus-visible{outline:3px solid var(--blue)}
.pick .k{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.pick b{font-family:var(--display);font-size:1.05rem}
.reveal{border-radius:12px;background:var(--blue-soft);padding:14px 18px;min-height:56px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:1rem}
th,td{padding:14px 16px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-family:var(--display);font-weight:700;color:var(--blue);font-size:.95rem;background:#f7fbfa}
td.form{font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--blue);white-space:nowrap}
.hl{color:var(--blue);font-weight:600}
.n-right{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.pickrow{cursor:pointer}
tr.pickrow:hover td{background:#f7fbfa}
tr.pickrow.on td{background:var(--green-soft)}
.formula{font-family:var(--mono);font-size:.98rem;background:#f4f8f7;border:1px solid var(--line);border-radius:10px;padding:10px 14px;overflow-x:auto;white-space:nowrap}
.formula b{color:var(--green-2)}
.big{font-family:var(--display);font-weight:800;font-size:2rem;color:var(--green-2);font-variant-numeric:tabular-nums}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.85rem;color:var(--muted)}
input,select{font:inherit;font-family:var(--mono);font-size:1rem;color:var(--ink);background:#f7fbfa;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-soft)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fs{border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--card);font-weight:500;opacity:.5;transition:all .25s}
.fs.on{opacity:1;border-color:var(--green);background:var(--green-soft)}
.fs.no{opacity:1;border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.arrow{color:var(--muted);font-family:var(--mono)}
.stamp{display:inline-block;transform:rotate(-5deg);border:3px solid currentColor;border-radius:8px;padding:6px 16px;font-family:var(--display);font-weight:800;letter-spacing:.04em}
.datecards{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.datecard{border:1px solid var(--line);border-top:8px solid var(--blue);border-radius:14px;padding:22px;background:var(--card)}
.datecard.g{border-top-color:var(--green)}
.datecard .d{font-family:var(--display);font-weight:800;font-size:clamp(2rem,5vw,3.2rem);color:var(--blue-2);line-height:1.05}
.datecard.g .d{color:var(--green-2)}
.datecard p{margin-top:10px;font-size:1.05rem}
.monthly{border-radius:14px;background:var(--blue-soft);padding:16px 20px}
.monthly ul{display:flex;flex-wrap:wrap;gap:8px 22px;margin:10px 0 0;padding:0;list-style:none}
.monthly li::before{content:"●";color:var(--blue);margin-right:6px;font-size:.8em}
.check{border:1px dashed var(--green);border-radius:14px;padding:16px 18px;background:#fbfefd}
.check .q{font-weight:600;margin-bottom:10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;cursor:pointer}
.opt:hover{border-color:var(--ink)}
.opt.right{background:var(--green-soft);border-color:var(--green);color:var(--green-2);font-weight:600}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.fb{margin-top:10px;font-size:.95rem}

/* work */
.monitor{position:sticky;top:57px;z-index:15;background:var(--ink);color:#fff}
.monitor .wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding-block:10px;font-size:.95rem}
.monitor .who{font-weight:600}
.monitor .chipv{background:rgba(255,255,255,.14);border-radius:999px;padding:3px 10px;font-family:var(--mono);font-size:.85rem}
.monitor .leaves{margin-left:auto;font-family:var(--mono);background:var(--green);border-radius:8px;padding:6px 12px}
.monitor .leaves.has{background:var(--bad);animation:pulse 1s ease 2}
@keyframes pulse{50%{transform:scale(1.08)}}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,36px);margin-block:24px 50px}
.warnbox{border:2px solid var(--warn);background:var(--warn-soft);border-radius:14px;padding:16px 18px}
.warnbox h3{font-size:1.1rem;color:var(--warn);margin-bottom:6px}
.qlist{display:grid;gap:18px;counter-reset:q}
.qitem{border:1px solid var(--line);border-radius:14px;padding:18px;counter-increment:q}
.qitem .qh{display:flex;gap:10px;align-items:baseline;margin-bottom:12px}
.qitem .qh::before{content:counter(q);font-family:var(--display);font-weight:800;color:var(--green);font-size:1.3rem;min-width:24px}
.qitem .pts{margin-left:auto;font-family:var(--mono);font-size:.8rem;color:var(--muted);white-space:nowrap}
.choice{display:grid;gap:8px}
.choice label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.choice label:has(input:checked){border-color:var(--blue);background:var(--blue-soft)}
.choice input{width:auto;margin-top:4px}
.result{text-align:center;display:grid;gap:14px;justify-items:center}
.score{font-family:var(--display);font-weight:800;font-size:clamp(3rem,10vw,5rem);color:var(--green-2);line-height:1}
.code{font-family:var(--mono);font-size:clamp(1rem,3vw,1.4rem);background:var(--blue-soft);color:var(--blue-2);border-radius:10px;padding:12px 18px;letter-spacing:.04em;word-break:break-all}
.overlay{position:fixed;inset:0;background:rgba(16,48,47,.55);display:grid;place-items:center;z-index:50;padding:16px}
.dialog{background:var(--card);border-radius:18px;padding:26px;max-width:460px;width:100%;display:grid;gap:14px}
.dialog h3{font-size:1.3rem}
.namegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px;max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px}
.nm{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 10px;border-radius:8px;display:flex;gap:8px;align-items:baseline;font-size:.95rem}
.nm:hover{background:var(--green-soft)}
.nm[aria-pressed="true"]{background:var(--green);color:#fff}
.nm[aria-pressed="true"] .no{color:#fff}
.nm .no{font-family:var(--mono);font-size:.78rem;color:var(--muted);min-width:22px}
.nm.done{opacity:.45;cursor:not-allowed;text-decoration:line-through}
.nm:focus-visible{outline:3px solid var(--blue)}
.search{margin-bottom:8px}
.jt td,.jt th{padding:9px 10px;font-size:.9rem}
table.sm td,table.sm th{padding:10px 12px;font-size:.92rem}

/* topic 1: plain-language visuals */
.ref-s{display:inline-block;font-family:var(--mono);font-size:.72rem;font-weight:500;color:var(--blue-2);background:var(--blue-soft);border-radius:6px;padding:1px 7px;letter-spacing:.02em;vertical-align:middle}
.box h4 .ref-s{margin-left:6px}
.ul{margin:0;padding-left:18px;display:grid;gap:5px;font-size:.98rem}
.ul li::marker{color:var(--green)}
.tree{display:grid;justify-items:center;gap:0}
.tree-root{background:var(--ink);color:#fff;font-family:var(--display);font-weight:800;font-size:1.15rem;border-radius:12px;padding:12px 22px;display:flex;gap:10px;align-items:center}
.tree-root .ref-s{background:rgba(255,255,255,.15);color:#fff}
.tree-lines{width:60%;height:28px;position:relative;border:2px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;margin-top:14px}
.tree-lines::before{content:"";position:absolute;left:50%;top:-16px;height:14px;border-left:2px solid var(--line)}
.tree-lines span{display:none}
.tree-kids{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%}
.tree-kid{border-radius:14px;padding:16px 18px;display:grid;gap:6px;align-content:start}
.tree-kid.b{background:var(--blue-soft)}.tree-kid.g{background:var(--green-soft)}
.tree-kid>b{font-family:var(--display);font-size:1.15rem}
.tree-kid .ref-s{justify-self:start}
.tree-kid ul{margin:0;padding-left:18px;color:var(--muted);font-size:.95rem}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.facts>div{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px;align-content:start}
.facts .fi{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.facts .ref-s{justify-self:start}
.eqs{display:grid;gap:10px}
.eq{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-radius:12px;padding:14px 18px;font-size:1.1rem}
.eq.b{background:var(--blue-soft)}.eq.g{background:var(--green-soft)}
.eq b{font-family:var(--display);font-size:1.25rem}
.eq span{font-family:var(--mono);color:var(--muted)}
.eq i{font-style:normal;background:var(--card);border-radius:8px;padding:4px 10px}
.life{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding-top:4px}
.life-track{position:absolute;left:10%;right:10%;top:22px;height:4px;background:var(--line);border-radius:2px}
.life-track i{display:block;height:100%;width:0;background:var(--green);border-radius:2px;transition:width .5s}
.life-node{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:grid;justify-items:center;text-align:center;gap:4px;padding:0 4px 8px;border-radius:12px}
.life-node:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.life-node .dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--card);border:3px solid var(--line);color:var(--muted);transition:all .25s}
.life-node .when{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.life-node .ev{font-size:.9rem;line-height:1.25}
.life-node .kind{font-family:var(--display);font-size:.98rem}
.life-node.past .dot{border-color:var(--green);color:var(--green-2)}
.life-node.on .dot{background:var(--green);border-color:var(--green);color:#fff;transform:scale(1.15)}
.life-node.on.b .dot{background:var(--blue);border-color:var(--blue)}
.life-node.on.bad .dot{background:var(--bad);border-color:var(--bad)}
.life-node.on .kind{color:var(--green-2)}.life-node.on.b .kind{color:var(--blue-2)}.life-node.on.bad .kind{color:var(--bad)}
.life-out{border-radius:14px;padding:16px 20px;display:grid;gap:6px;border-left:6px solid var(--green);background:var(--green-soft);animation:in .25s ease}
.life-out.b{border-color:var(--blue);background:var(--blue-soft)}.life-out.bad{border-color:var(--bad);background:var(--bad-soft)}
.life-out .lo-kind{font-family:var(--display);font-weight:800;font-size:1.4rem}
.life-out .ref-s{justify-self:start}
@media (max-width:700px){
  .tree-kids,.facts{grid-template-columns:1fr}.tree-lines{display:none}.tree-root{margin-bottom:12px}
  .life{grid-template-columns:1fr;gap:4px}.life-track{left:19px;right:auto;top:20px;bottom:20px;width:4px;height:auto}
  .life-track i{width:100%!important;height:0}
  .life-node{grid-template-columns:40px auto;justify-items:start;text-align:left;column-gap:12px;row-gap:0;padding:4px 0}
  .life-node .dot{grid-row:span 3}
}

/* home: practice tile */
.tile.practice{background:var(--blue-soft);border-color:var(--blue)}
.tile.practice .n{color:var(--blue)}
/* practice */
.pr-sheet{display:grid;gap:16px;max-width:860px;margin-inline:auto}
.pr-lead{color:var(--muted);margin-top:6px;max-width:65ch}
.pr-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.pr-score{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pr-bar{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.pr-bar i{height:8px;border-radius:4px;background:var(--line)}
.pr-bar i.cur{background:var(--blue)}.pr-bar i.ok{background:var(--green)}.pr-bar i.no{background:var(--bad)}
.pr-q{display:grid;gap:14px}
.pr-q h3{font-size:clamp(1.15rem,2.4vw,1.45rem)}
.pr-opts{display:grid;gap:8px}
.pr-opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:baseline;border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);line-height:1.35}
.pr-opt:hover:not(:disabled){border-color:var(--blue)}
.pr-opt:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.pr-opt:disabled{cursor:default}
.pr-opt .L{font-family:var(--display);font-weight:800;color:var(--blue);min-width:1.2em}
.pr-opt.right{border-color:var(--green);background:var(--green-soft)}.pr-opt.right .L{color:var(--green-2)}
.pr-opt.wrong{border-color:var(--bad);background:var(--bad-soft)}.pr-opt.wrong .L{color:var(--bad)}
.pr-why{display:grid;gap:8px;border-radius:12px;background:#f7fbfa;border:1px solid var(--line);padding:14px 16px;animation:in .25s ease}
.pr-why .ref-s{justify-self:start}
.pr-verdict{font-family:var(--display);font-weight:800;font-size:1.15rem}
.pr-verdict.ok{color:var(--green-2)}.pr-verdict.no{color:var(--bad)}
.pr-review{display:grid;gap:10px}
.pr-ritem{border-left:4px solid var(--green);background:var(--green-soft);border-radius:0 10px 10px 0;padding:10px 14px;display:grid;gap:4px;font-size:.95rem}
.pr-ritem.no{border-color:var(--bad);background:var(--bad-soft)}
.pr-rw{color:var(--muted)}
/* admin */
.adm{padding-block:22px 50px;display:grid;gap:16px}
.adm-body{display:grid;gap:16px}
.adm-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

const K_RES='k8_results_v1', K_RUN='k8_run_v1';
function results(){return store.get(K_RES,[])}
function sig(s){let h1=0x811c9dc5;for(const ch of s+'|k8-2026'){h1^=ch.codePointAt(0);h1=Math.imul(h1,16777619)>>>0}return h1.toString(36).toUpperCase().padStart(6,'0').slice(-5)}
function makeCode(r){const base='N'+r.no+'-V'+r.v+'-S'+r.score+'-P'+r.leaves+'-T'+r.mins;return base+'-'+sig(base)}
function parseCode(c){c=(c||'').trim().toUpperCase();const m=c.match(/^N(\d+)-V(\d)-S(\d+)-P(\d+)-T(\d+)-([0-9A-Z]{5})$/);if(!m)return null;const base=c.slice(0,c.lastIndexOf('-'));return {no:+m[1],v:+m[2],score:+m[3],leaves:+m[4],mins:+m[5],ok:sig(base)===m[6]}}

function syncPending(){results().filter(r=>!r.synced).forEach(r=>{syncResult(r)});window.K8X&&window.K8X.syncPending()}

function renderTest(run,resumed){view.innerHTML='';const mon=$('#monitor');mon.hidden=false;$('#homeBtn').hidden=true;
 const s=NAMES.find(x=>x.no===run.no);$('#mWho').textContent=s.name;$('#mVar').textContent='Вариант '+run.v;
 const qs=VARIANTS[run.v];let away=false,awayStart=0;
 if(resumed){run.leaves++;run.events.push({t:Date.now(),e:'reload'});store.set(K_RUN,run)}
 const paint=()=>{const l=$('#mLeaves');l.textContent='Переходов со страницы: '+run.leaves;l.classList.toggle('has',run.leaves>0)};paint();
 const leave=(why)=>{if(away)return;away=true;awayStart=Date.now();run.leaves++;run.events.push({t:awayStart,e:why});store.set(K_RUN,run);paint()};
 const back=()=>{if(!away)return;away=false;run.awayMs+=Date.now()-awayStart;store.set(K_RUN,run);paint();
  dialog('<h3 style="color:var(--bad)">Вы покинули страницу</h3><p>Переход зафиксирован. Всего переходов: <b>'+run.leaves+'</b>.</p>',[{t:'Вернуться к работе'}])};
 const vis=()=>{document.hidden?leave('hidden'):back()};const bl=()=>leave('blur');const fo=()=>back();const ph=()=>{store.set(K_RUN,run)};
 document.addEventListener('visibilitychange',vis);window.addEventListener('blur',bl);window.addEventListener('focus',fo);window.addEventListener('pagehide',ph);
 const timer=setInterval(()=>{const m=Math.floor((Date.now()-run.started)/1000);$('#mTime').textContent=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')},1000);
 cleanup=()=>{document.removeEventListener('visibilitychange',vis);window.removeEventListener('blur',bl);window.removeEventListener('focus',fo);window.removeEventListener('pagehide',ph);clearInterval(timer)};
 const w=h('<section class="wrap"><div class="sheet" style="display:grid;gap:18px"></div></section>');const sh=w.firstElementChild;
 sh.append(h('<div><div class="label">Вариант '+run.v+' · '+MAXPTS+' баллов</div><h2 style="font-size:1.5rem;margin-top:6px">'+s.name+'</h2><p style="color:var(--muted);margin-top:6px">Задания 1–6: выберите один ответ (2 балла). Задания 7–8: впишите число в тенге без пробелов и копеек (4 балла).</p></div>'));
 if(resumed)sh.append(h('<div class="warnbox"><h3>Работа продолжена после перезагрузки</h3><p>Перезагрузка засчитана как переход со страницы. Ваши ответы сохранены.</p></div>'));
 const list=h('<div class="qlist"></div>');
 qs.forEach((q,i)=>{const it=h('<div class="qitem"><div class="qh"><span>'+q[1]+'</span><span class="pts">'+q[4]+' б.</span></div></div>');
  if(q[0]==='c'){const c=h('<div class="choice"></div>');q[2].forEach((o,j)=>{const lab=h('<label><input type="radio" name="q'+i+'" value="'+j+'"><span>'+o+'</span></label>');const inp=lab.querySelector('input');if(run.answers[i]===j)inp.checked=true;inp.onchange=()=>{run.answers[i]=j;store.set(K_RUN,run)};c.appendChild(lab)});it.appendChild(c)}
  else{const inp=h('<input type="number" inputmode="numeric" placeholder="Ответ, ₸" style="max-width:260px">');if(run.answers[i]!=null)inp.value=run.answers[i];inp.oninput=()=>{run.answers[i]=inp.value===''?null:+inp.value;store.set(K_RUN,run)};it.appendChild(inp)}
  list.appendChild(it)});
 const submit=h('<button class="btn blue" type="button" style="justify-self:start;font-size:1.05rem;padding:13px 24px">Сдать работу</button>');
 submit.onclick=()=>{const empty=qs.filter((_,i)=>run.answers[i]==null).length;
  dialog('<h3>Сдать работу?</h3>'+(empty?'<p style="color:var(--bad)">Без ответа: '+empty+' из '+qs.length+'.</p>':'')+'<p>После сдачи изменить ответы и сдать работу ещё раз под этим именем нельзя.</p>',[{t:'Вернуться',cls:'ghost'},{t:'Сдать',on:finish}])};
 function finish(){let score=0;const detail=qs.map((q,i)=>{const a=run.answers[i];let ok=false;if(q[0]==='c')ok=a===q[3];else ok=a!=null&&Math.abs(a-q[2])<=q[3];if(ok)score+=q[4];return ok?1:0});
  const mins=Math.max(1,Math.round((Date.now()-run.started)/60000));
  const r={no:run.no,name:run.name,v:run.v,score,max:MAXPTS,leaves:run.leaves,awaySec:Math.round(run.awayMs/1000),mins,detail,at:new Date().toISOString()};r.code=makeCode(r);
  const all=results();if(!all.some(x=>x.no===r.no)){all.push(r);store.set(K_RES,all)}
  try{localStorage.removeItem(K_RUN)}catch(e){}cleanup();cleanup=null;$('#monitor').hidden=true;showResult(r)}
 sh.append(list,submit);view.append(w)}

function showResult(r){view.innerHTML='';const w=h('<section class="wrap"><div class="sheet result"></div></section>');const sh=w.firstElementChild;
 sh.append(h('<div class="label">Exit-ticket сдан</div>'),h('<h2 style="font-size:1.4rem">'+r.name+'</h2>'),h('<div class="score">'+r.score+' / '+r.max+'</div>'),
  h('<p>Вариант '+r.v+' · переходов со страницы: <b style="color:'+(r.leaves?'var(--bad)':'var(--green-2)')+'">'+r.leaves+'</b> · время: '+r.mins+' мин.</p>'),
  h('<p style="color:var(--muted)">Код результата — покажите его команде или перепишите в бланк:</p>'),h('<div class="code">'+r.code+'</div>'),
  h('<p style="color:var(--muted);font-size:.9rem">Верные ответы: '+r.detail.map((d,i)=>(i+1)+(d?' ✓':' ✗')).join(' · ')+'</p>'));
 if(ONLINE){const st=h('<div class="reveal" style="text-align:left">Отправляем результат в журнал…</div>');sh.append(st);
  (r.synced?Promise.resolve(true):syncResult(r)).then(ok=>{st.innerHTML=ok?'<b style="color:var(--green-2)">✓ Результат сохранён в общем журнале.</b>':'<b style="color:var(--bad)">Не удалось отправить результат: нет связи с сервером.</b> Не закрывайте браузер и не очищайте его — результат отправится сам, когда связь появится. Код выше — запасной способ.'})}
 const b=h('<button class="btn ghost" type="button">На главную</button>');b.onclick=()=>{location.hash='home'};sh.append(b);view.append(w)}

syncPending();
route();
})();
</script>
</body>
</html>
